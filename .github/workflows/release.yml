name: Create Release

# The release version and tag always come from desktop/package.json, so the
# tag, the installer filename and latest.yml can never disagree. Bump
# desktop/package.json, push, then run this workflow.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read version from desktop/package.json
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $version = "$($pkg.version)".Trim() -replace '^[vV]', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'desktop/package.json does not define a version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version  Tag: v$version"

      - name: Build web panel
        working-directory: web-panel
        run: |
          bun install
          bun run build
          bun run build:server

      - name: Build desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Prepare web assets
        working-directory: desktop
        run: bun run prepare:web

      - name: Build Windows installer
        working-directory: desktop
        run: bun run dist:win

      - name: Verify installer and latest.yml agree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.ver.outputs.version }}'
          $expected = "Enough-V2-Panel-Setup-$version.exe"
          $exe = "desktop/release/$expected"
          if (-not (Test-Path $exe)) {
            throw "Expected installer $expected was not produced. Files: $((Get-ChildItem desktop/release -Name) -join ', ')"
          }
          if (-not (Test-Path 'desktop/release/latest.yml')) { throw 'latest.yml was not produced' }
          $latest = Get-Content 'desktop/release/latest.yml' -Raw
          if ($latest -notmatch [regex]::Escape($expected)) {
            throw "latest.yml does not reference $expected"
          }
          if ((Get-Item $exe).Length -lt 1MB) { throw "$expected looks truncated" }
          Write-Host "OK: $expected and latest.yml match version $version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Enough V2 Panel ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          body: |
            ## Enough V2 Panel ${{ steps.ver.outputs.tag }} - Windows Release

            ### Windows Installer (.exe)
            Download the `.exe` file below to install Enough V2 Panel on Windows.

            ### Features
            - Cyber Neon themed UI
            - 83 SMS service definitions
            - Proxy backend for CORS bypass
            - ServiceDefinition registry for custom providers
            - Server-side API key management ({{env:VAR}} substitution)
            - Silent auto-update from GitHub Releases

            ### Installation
            1. Download `Enough-V2-Panel-Setup-${{ steps.ver.outputs.version }}.exe`
            2. Run the installer (NSIS)
            3. Launch "Enough V2 Panel" from the Start Menu

            ### API keys
            Put them in `%APPDATA%\Enough V2 Panel\.env`:

            ```
            PROVIDER_DEMO_KEY=your-key
            ALLOWED_HOSTS=example.com
            ```

            ### Note
            - `enough-V2/main.py` is untouched
            - Web catalog: https://cehennemgibiyim.github.io/sms/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

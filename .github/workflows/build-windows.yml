name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'web-panel/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web panel
        working-directory: web-panel
        run: |
          bun install
          bun run build
          bun run build:server

      - name: Build desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Prepare web assets
        working-directory: desktop
        run: bun run prepare:web

      - name: Build Windows installer
        working-directory: desktop
        run: bun run dist:win

      - name: List release output
        working-directory: desktop
        run: Get-ChildItem -Recurse release | Select-Object FullName, Length
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
